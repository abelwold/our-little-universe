name: Our Little Universe
on:
  push:
    paths: ['our-little-universe/**', 'netlify.toml', '.github/workflows/universe.yml']
  pull_request:
    paths: ['our-little-universe/**', 'netlify.toml', '.github/workflows/universe.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: our-little-universe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            our-little-universe/package-lock.json
            our-little-universe/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run build && npm run build --prefix functions
      - run: printf '%s\n' 'OPENAI_API_KEY=' > functions/.secret.local
      - run: npx --yes firebase-tools@15.34.0 emulators:exec --project demo-our-little-universe --only auth,firestore,functions "node --test tests/*.test.mjs"
